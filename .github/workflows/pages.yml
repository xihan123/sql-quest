name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Restore published content
        shell: bash
        run: |
          previous="$(git ls-remote --heads origin refs/heads/gh-pages)"
          if [[ -n "$previous" ]]; then
            git fetch --no-tags --depth=1 origin gh-pages
            git archive FETCH_HEAD content | tar -x -C public
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check code and content
        run: |
          npm run lint
          npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify content and production assets
        run: npm run test:browser -- content.spec.ts release.spec.ts

      - name: Build static site
        run: npm run build

      - name: Publish static site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          # Keep immutable content and hashed assets used by existing sessions.
          keep_files: true
